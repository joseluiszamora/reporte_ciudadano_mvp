name: backend
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reportes
      POSTGRES_USER: reportes
      POSTGRES_PASSWORD: reportes_local
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportes -d reportes"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
